<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лист Персонажа</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #ffffff; /* Белый для максимального контраста текста */
            --text-color:#e0e0e0;
            --border-color:#333333;
            --accent-color:#4CAF50;
            --danger-color:#f44336;
            /* Менее контрастные цвета для кнопок */
            --btn-bg:#2a2a2a;
            --btn-text:#cccccc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
        }
        .menu-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }
        /* Main container */
        main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }
        /* Form elements */
        .form-group {
            margin-bottom: 15px;
        }
        /* Яркие, контрастные заголовки */
        label, .section-title {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--primary-color); 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-title {
            margin-top: 10px;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
        }
        input[type="text"]:focus, textarea:focus, select:focus {
            border-color:#555555;
        }
        input:disabled, textarea:disabled, select:disabled {
            opacity: 0.8;
            background-color: transparent;
            border-color: transparent;
            padding-left: 0;
            padding-right: 0;
            color: var(--text-color);
        }
        select:disabled {
            appearance: none;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        /* Attributes grid */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            width: max-content;
            padding: 12px 24px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
			text-align: center;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-main {
            background-color: var(--btn-bg);
            color: var(--btn-text);
        }
        /* Dice section */
#dice-section{
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
            text-align: center;
            margin-bottom: 10px;
        }
        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .die {
            width: 70px;
            height: 70px;
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        /* Анимация вращения кубиков */
        .spinning {
            animation: spin 0.3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* Sidebar */
		#sidebar{
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            max-width: 300px;
            height: 100vh;
            background-color: var(--surface-color);
            border-left: 1px solid var(--border-color);
            transition: right 0.3s ease;
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
		#sidebar.open {
            right: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-header h2 {
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .character-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        .char-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .char-item:hover {
            background-color:#2a2a2a;
        }
        .char-item.active {
            border-left: 4px solid var(--accent-color);
            background-color:#252525;
        }
        .char-name {
            flex: 1;
            font-weight: 500;
            color: var(--text-color);
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }
        /* Overlay */
		#overlay{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 150;
            display: none;
        }
		#overlay.open {
            display: block;
        }
        /* Новые стили для описания бросков */
        .roll-results-desc {
            border-radius: 6px;
            padding: 0px 0px;
            margin: 0 auto 20px auto;
            width: max-content;
            font-size: 0.9rem;
            /* Добавляем Flexbox для выстраивания в строку */
            display: flex;
            gap: 15px; /* Расстояние между результатами */
            flex-wrap: wrap;
            justify-content: center;
        }
        /* Новый класс для белых жирных цифр */
        .roll-num { 
            color: var(--primary-color); 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Лист Персонажа</h1>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </header>
    <main>
        <div class="form-group">
            <label for="char-name">Имя</label>
			<input type="text" id="char-name" placeholder="Введите имя...">
        </div>
        <div class="form-group">
            <label for="char-concept">Концепт</label>
            <input type="text" id="char-concept" placeholder="Кем является персонаж...">
        </div>
        <div class="form-group">
            <label for="char-desc">Описание</label>
            <textarea id="char-desc" placeholder="Внешность, история, особенности..."></textarea>
        </div>
        <div class="section-title">Характеристики:</div>
        <div class="attributes-grid">
            <div class="form-group">
                <label for="attr-phys">Физика</label>
                <select id="attr-phys" class="attr-select">
                    <option value="">-</option>
                    <option value="+2">+2</option>
                    <option value="+1">+1</option>
                    <option value="0">0</option>
                </select>
            </div>
            <div class="form-group">
                <label for="attr-ment">Разум</label>
                <select id="attr-ment" class="attr-select">
                    <option value="">-</option>
                    <option value="+2">+2</option>
                    <option value="+1">+1</option>
                    <option value="0">0</option>
                </select>
            </div>
            <div class="form-group">
                <label for="attr-soc">Общение</label>
                <select id="attr-soc" class="attr-select">
                    <option value="">-</option>
                    <option value="+2">+2</option>
                    <option value="+1">+1</option>
                    <option value="0">0</option>
                </select>
            </div>
        </div>
        <!-- Блок с кубиками  -->
        <div id="dice-section">
            <div class="dice-container">
                <div class="die" id="die1">1</div>
                <div class="die" id="die2">1</div>
            </div>
            <!-- Описание результатов броска -->
            <div class="roll-results-desc">
                <span><span class="roll-num">10+</span> Успех</span>
                <span><span class="roll-num">7-9</span> Успех с ценой</span>
                <span><span class="roll-num">2-6</span> Провал</span>
            </div>
            <div class="btn-container">
                <button class="btn btn-main" onclick="rollDice()">Бросок кубиков</button>
            </div>
        </div>
        <div class="btn-container">
            <button id="toggle-state-btn" class="btn btn-main" onclick="toggleEditState()">Сохранить</button>
        </div>
    </main>
    <div id="overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Персонажи</h2>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="character-list" id="char-list">
            <!-- Список персонажей -->
        </div>
        <div class="sidebar-footer">
            <button class="btn btn-main" onclick="createNewCharacter()">Новый персонаж</button>
        </div>
    </div>
<script>
    let characters = [];
    let currentCharId = null;
    let isEditing = true;
    let isRolling = false;

    // Инициализация переменных для полей ввода
    let inputs, attrSelects, toggleBtn, diceSection, die1, die2, sidebar, overlay, charListEl;

    document.addEventListener("DOMContentLoaded", () => {
        // Назначаем элементы только после полной загрузки документа
        inputs = {
            name: document.getElementById('char-name'),
            concept: document.getElementById('char-concept'),
            desc: document.getElementById('char-desc'),
            phys: document.getElementById('attr-phys'),
            ment: document.getElementById('attr-ment'),
            soc: document.getElementById('attr-soc')
        };
        attrSelects = [inputs.phys, inputs.ment, inputs.soc];
        toggleBtn = document.getElementById('toggle-state-btn');
        diceSection = document.getElementById('dice-section');
        die1 = document.getElementById('die1');
        die2 = document.getElementById('die2');
        sidebar = document.getElementById('sidebar');
        overlay = document.getElementById('overlay');
        charListEl = document.getElementById('char-list');

        // Загрузка данных
        loadData();
        if (characters.length === 0) {
            createNewCharacter();
        } else {
            loadCharacter(characters[0].id);
        }
        
        // Слушатели для логики селектов (исключение одинаковых атрибутов)
        attrSelects.forEach(select => {
            select.addEventListener('change', updateSelectsOptions);
        });

        // АВТОСОХРАНЕНИЕ: при любом изменении текста или селекта
        const formElements = [inputs.name, inputs.concept, inputs.desc, ...attrSelects];
        formElements.forEach(el => {
            el.addEventListener('input', () => {
                if (isEditing) {
                    saveCurrentForm();
                }
            });
        });
    });

    function loadData() {
        try {
            const data = localStorage.getItem('ttrpg_characters');
            if (data) {
                const parsed = JSON.parse(data);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    characters = parsed;
                }
            }
        } catch (e) {
            console.error("Ошибка чтения данных из localStorage", e);
            characters = [];
        }
    }

    function saveData() {
        try {
            localStorage.setItem('ttrpg_characters', JSON.stringify(characters));
        } catch (e) {
            console.error("Ошибка сохранения данных (возможно, приватный режим)", e);
        }
    }

    function updateSelectsOptions() {
        const selectedValues = attrSelects.map(s => s.value).filter(v => v !== "");
        attrSelects.forEach(select => {
            Array.from(select.options).forEach(option => {
                if (option.value === "") return;
                if (selectedValues.includes(option.value) && select.value !== option.value) {
                    option.disabled = true;
                    option.style.display = 'none';
                } else {
                    option.disabled = false;
                    option.style.display = '';
                }
            });
        });
    }

    function createNewCharacter() {
        const newChar = {
            id: Date.now().toString(),
            name: '', concept: '', desc: '', phys: '', ment: '', soc: ''
        };
        characters.push(newChar);
        currentCharId = newChar.id;
        isEditing = true;
        
        fillForm(newChar);
        updateUIState();
        saveData();
        renderCharList();
        toggleSidebar(false);
    }

    function loadCharacter(id) {
        const char = characters.find(c => c.id === id);
        if (char) {
            currentCharId = id;
            isEditing = false;
            fillForm(char);
            updateUIState();
            renderCharList();
            toggleSidebar(false);
        }
    }

    function deleteCharacter(id, event) {
        event.stopPropagation();
        if (confirm('Удалить этого персонажа?')) {
            characters = characters.filter(c => c.id !== id);
            saveData();
            if (characters.length === 0) createNewCharacter();
            else if (currentCharId === id) loadCharacter(characters[0].id);
            else renderCharList();
        }
    }

    function fillForm(char) {
        inputs.name.value = char.name || '';
        inputs.concept.value = char.concept || '';
        inputs.desc.value = char.desc || '';
        inputs.phys.value = char.phys || '';
        inputs.ment.value = char.ment || '';
        inputs.soc.value = char.soc || '';
        updateSelectsOptions();
    }

    function saveCurrentForm() {
        const char = characters.find(c => c.id === currentCharId);
        if (char) {
            char.name = inputs.name.value; // Без 'Безымянный' в поле ввода, чтобы не мешало печатать
            char.concept = inputs.concept.value;
            char.desc = inputs.desc.value;
            char.phys = inputs.phys.value;
            char.ment = inputs.ment.value;
            char.soc = inputs.soc.value;
            saveData();
            renderCharList();
        }
    }

    function toggleEditState() {
        if (isEditing) {
            saveCurrentForm();
            isEditing = false;
        } else {
            isEditing = true;
        }
        updateUIState();
    }

    function updateUIState() {
        const formElements = [inputs.name, inputs.concept, inputs.desc, ...attrSelects];
        if (isEditing) {
            formElements.forEach(el => el.disabled = false);
            toggleBtn.textContent = 'Сохранить';
            diceSection.style.display = 'none';
        } else {
            formElements.forEach(el => el.disabled = true);
            toggleBtn.textContent = 'Изменить';
            diceSection.style.display = 'block';
        }
    }

    function rollDice() {
        if (isRolling) return;
        isRolling = true;
        
        die1.classList.add('spinning');
        die2.classList.add('spinning');
        
        let rolls = 0;
        const maxRolls = 15;
        const intervalTime = 60;

        const rollInterval = setInterval(() => {
            die1.textContent = Math.floor(Math.random() * 6) + 1;
            die2.textContent = Math.floor(Math.random() * 6) + 1;
            rolls++;

            if (rolls >= maxRolls) {
                clearInterval(rollInterval);
                die1.classList.remove('spinning');
                die2.classList.remove('spinning');
                
                die1.textContent = Math.floor(Math.random() * 6) + 1;
                die2.textContent = Math.floor(Math.random() * 6) + 1;
                isRolling = false;
            }
        }, intervalTime);
    }

    function toggleSidebar(forceState) {
        const isOpen = sidebar.classList.contains('open');
        if (forceState === true || (forceState === undefined && !isOpen)) {
            sidebar.classList.add('open');
            overlay.classList.add('open');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }
    }

    function renderCharList() {
        charListEl.innerHTML = '';
        characters.forEach(char => {
            const item = document.createElement('div');
            item.className = `char-item ${char.id === currentCharId ? 'active' : ''}`;
            item.onclick = () => loadCharacter(char.id);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'char-name';
            nameSpan.textContent = char.name || 'Безымянный';

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '✕';
            delBtn.onclick = (e) => deleteCharacter(char.id, e);

            item.appendChild(nameSpan);
            item.appendChild(delBtn);
            charListEl.appendChild(item);
        });
    }
</script>
</body>
</html>
